services:
  backend:
    build:
      context: ./backend
      dockerfile: Dockerfile
    container_name: streamocr-backend
    ports:
      - "8000:8000"
    environment:
      HOST: 0.0.0.0
      PORT: "8000"
    restart: unless-stopped

  frontend:
    build:
      context: ./frontend
      dockerfile: Dockerfile
    container_name: streamocr-frontend
    ports:
      - "8080:80"
    depends_on:
      - backend
    restart: unless-stopped
